<!--pageidx:start-->
<style id="pageidx-style">
#pgidx{position:fixed;top:16px;left:max(8px,calc(50% - 380px - 136px));width:112px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--card);border:1px solid var(--line,var(--border,#e3e6ec));border-radius:10px;padding:8px 6px;font-size:.8rem;z-index:9;scrollbar-width:thin}
#pgidx .pgh{font-weight:700;color:var(--muted);margin:0 0 6px 4px;font-size:.72rem;line-height:1.3}
#pgidx a{display:block;padding:2px 8px;border-radius:6px;text-decoration:none;color:var(--fg);line-height:1.6;white-space:nowrap}
#pgidx a:hover{background:var(--soft,color-mix(in srgb,var(--accent) 9%,transparent))}
#pgidx a.on{background:var(--accent);color:var(--bg);font-weight:700}
.src a{color:inherit;text-decoration:none}
.src.go{cursor:pointer;border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.src.go:hover{background:var(--accent);color:var(--bg)}
.src.go a::after{content:"↗";font-size:.8em;margin-left:.3em;opacity:.85}
.src{display:inline-block;font-size:.82em;font-weight:600;line-height:1.25;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:999px;padding:0 .55em;margin:0 .15em;vertical-align:.05em;white-space:nowrap}
@media (max-width:1060px){
  body{padding-left:88px}
  #pgidx{left:8px;width:72px}
}
@media (max-width:860px){
  .src{white-space:normal;overflow-wrap:anywhere}
}
@media (max-width:520px){
  body{padding-left:62px}
  #pgidx{left:4px;width:54px;padding:6px 3px;font-size:.74rem}
  #pgidx a{padding:2px 4px}
}
</style>
<nav id="pgidx" aria-label="슬라이드 페이지"><p class="pgh">슬라이드<br>페이지</p></nav>
<script id="pageidx-script" data-main="__MAIN__">
(function(){
  var MAIN=document.getElementById('pageidx-script').getAttribute('data-main');
  var box=document.getElementById('pgidx');
  // 1) 출처(.src)에서 원자료(MAIN)의 페이지 번호 수집
  //    data-noidx가 붙은 h2부터 다음 h2 전까지(기본 용어·원자료 해설·요약 등)와 접히는 블록(details: 기본 용어·보충 설명·추가 예시 등) 안의 출처는 강조 대상에서 뺀다
  var pages={}, cites=[], k=0, skip=false;
  document.querySelectorAll('h2, .src').forEach(function(el){
    if(el.tagName==='H2')skip=el.hasAttribute('data-noidx');
    else el._skip=skip||!!el.closest('details,[data-noidx]');
  });
  var re=/([^\s,·()]+\.(?:pdf|ipynb))|p\.\s*(\d+)(?:\s*[–-]\s*(\d+))?|,\s*(\d+)(?:\s*[–-]\s*(\d+))?/g;
  document.querySelectorAll('.src').forEach(function(el){
    var t=el.textContent, m, file=MAIN, lastPage=false, found=[];
    re.lastIndex=0;
    while((m=re.exec(t))){
      if(m[1]){file=m[1];lastPage=false;continue;}
      var a,b;
      if(m[2]){a=+m[2];b=m[3]?+m[3]:a;}
      else if(lastPage){a=+m[4];b=m[5]?+m[5]:a;}
      else continue;
      lastPage=true;
      if(file!==MAIN||b<a||b-a>20)continue;
      for(var p=a;p<=b;p++)found.push(p);
    }
    if(!found.length)return;
    if(!el.id)el.id='cite-'+(++k);
    el._pages=found; cites.push(el);
    found.forEach(function(p){
      var l=pages[p]=pages[p]||[];
      if(l.indexOf(el)<0)el._skip?l.push(el):l.splice(l.filter(function(c){return !c._skip;}).length,0,el);
    });
  });
  // 1b) 인용한 페이지의 원자료 블록(id="orig-pN")이 문서에 있으면 배지 자체를 그 블록으로 가는 링크로 만든다
  cites.forEach(function(el){
    if(el.querySelector('a'))return;
    for(var i=0;i<el._pages.length;i++){
      var o=document.getElementById('orig-p'+el._pages[i]);
      if(o){var a=document.createElement('a');a.href='#orig-p'+el._pages[i];a.title='원자료 p.'+el._pages[i]+' 보기';while(el.firstChild)a.appendChild(el.firstChild);el.appendChild(a);el.classList.add('go');break;}
    }
  });
  var keys=Object.keys(pages).map(Number).sort(function(a,b){return a-b;});
  if(!keys.length){box.remove();return;}
  // 2) 페이지 목록(항상 표시)
  var links={}, lock=null, cur='';
  keys.forEach(function(p){
    var a=document.createElement('a');
    a.href='#'+pages[p][0].id;
    a.textContent='p.'+p;
    a.addEventListener('click',function(){
      for(var d=pages[p][0].parentElement;d;d=d.parentElement){if(d.tagName==='DETAILS')d.open=true;}
      lock=true; setActive([p]);
    });
    box.appendChild(a); links[p]=a;
  });
  // 3) scrollspy: 화면 위쪽 기준선을 마지막으로 지난 출처의 첫 페이지 하나만 강조(범위 인용도 한 칸)
  function setActive(act){
    var key=act.join(',');
    if(key===cur)return; cur=key;
    keys.forEach(function(p){links[p].classList.toggle('on',act.indexOf(p)>=0);});
    if(act.length){var a=links[act[0]];box.scrollTo({top:a.offsetTop-box.clientHeight/2+a.offsetHeight/2,behavior:'smooth'});}
  }
  function spy(){
    ticking=false;
    if(lock)return; // 목록을 눌러 이동한 직후에는 누른 페이지 유지
    var line=Math.min(window.innerHeight*0.3,160), best=null, bestTop=-Infinity;
    cites.forEach(function(el){
      if(!el.offsetParent)return; // 접힌 details 안은 제외
      var t=el.getBoundingClientRect().top;
      if(t<=line&&t>bestTop){bestTop=t;best=el;}
    });
    setActive(best&&!best._skip?[best._pages[0]]:[]);
  }
  var ticking=false;
  function req(){if(!ticking){ticking=true;setTimeout(spy,60);}}
  ['wheel','touchmove','keydown'].forEach(function(ev){
    window.addEventListener(ev,function(e){if(lock&&!(e.target.closest&&e.target.closest('#pgidx'))){lock=null;req();}},{passive:true});
  });
  window.addEventListener('scroll',req,{passive:true});
  window.addEventListener('resize',req);
  document.addEventListener('toggle',req,true);
  spy();
})();
</script>
<!--pageidx:end-->
