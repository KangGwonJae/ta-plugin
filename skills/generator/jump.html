<!--jump:start-->
<style id="jump-style">
#jumpback{position:fixed;right:20px;bottom:20px;z-index:10;display:none;align-items:center;gap:11px;width:max-content;max-width:min(340px,calc(100vw - 40px));padding:8px 16px 8px 8px;border:0;border-radius:14px;background:var(--accent);color:var(--bg);font:inherit;text-align:left;white-space:nowrap;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.22);animation:jb-in .2s ease-out}
#jumpback.show{display:flex}
#jumpback .jb-ic{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--bg) 18%,transparent);font-size:1.05rem;line-height:1}
#jumpback .jb-tx{display:flex;flex-direction:column;gap:1px;min-width:0;line-height:1.3}
#jumpback .jb-lb{font-size:.72rem;font-weight:600;letter-spacing:.02em;opacity:.78}
#jumpback .jb-to{overflow:hidden;text-overflow:ellipsis;font-size:.9rem;font-weight:650}
#jumpback .jb-n{flex:none;align-self:center;min-width:1.5em;text-align:center;font-size:.72rem;font-weight:700;background:color-mix(in srgb,var(--bg) 22%,transparent);border-radius:999px;padding:2px 7px}
#jumpback .jb-n:empty{display:none}
#jumpback:hover{filter:brightness(1.08)}
.jump-flash{animation:jump-flash 1.8s ease-out}
@keyframes jump-flash{0%,30%{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}100%{background:transparent;box-shadow:0 0 0 4px transparent}}
@keyframes jb-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<button id="jumpback" type="button" title="읽던 곳으로 돌아가기 (Backspace)"><span class="jb-ic">↩</span><span class="jb-tx"><span class="jb-lb">읽던 곳으로</span><span class="jb-to"></span></span><span class="jb-n"></span></button>
<script id="jump-script">
(function(){
  // 문서 안 링크(#…)로 이동할 때 출발 위치를 쌓아 두고, 버튼으로 하나씩 되돌아간다
  var btn=document.getElementById('jumpback'), stack=[];
  var old=document.getElementById('backbtn'); if(old)old.remove(); // 예전 history.back() 버튼 대체
  function flash(el){el.classList.remove('jump-flash');void el.offsetWidth;el.classList.add('jump-flash');setTimeout(function(){el.classList.remove('jump-flash');},1900);}
  function openTo(el){for(var d=el;d;d=d.parentElement){if(d.tagName==='DETAILS')d.open=true;}}
  function isFixed(el){ // 왼쪽 색인·용어 패널처럼 화면에 고정된 요소 안의 링크인지
    for(var d=el;d&&d!==document.body;d=d.parentElement){var p=getComputedStyle(d).position;if(p==='fixed'||p==='sticky')return true;}
    return false;
  }
  function headingBefore(test){ // test(heading)가 참인 마지막 h2/h3 제목
    var hs=document.querySelectorAll('h2,h3'), t='';
    for(var i=0;i<hs.length;i++){if(test(hs[i]))t=hs[i].textContent;else break;}
    return t.trim();
  }
  function whereEl(el){return headingBefore(function(h){return !!(h.compareDocumentPosition(el)&Node.DOCUMENT_POSITION_FOLLOWING);});}
  function whereView(){var line=Math.min(window.innerHeight*0.3,160);return headingBefore(function(h){return h.getBoundingClientRect().top<=line;});}
  function render(){
    if(!stack.length){btn.classList.remove('show');return;}
    btn.querySelector('.jb-to').textContent=stack[stack.length-1].label||'문서 처음';
    btn.querySelector('.jb-n').textContent=stack.length>1?stack.length:'';
    btn.classList.add('show');
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#"]');
    if(!a||a.classList.contains('term')||a.getAttribute('href').length<2)return;
    var t=document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1))); if(!t)return;
    e.preventDefault();
    if(isFixed(a))stack.push({y:window.scrollY, label:whereView()}); // 고정 요소에서 눌렀으면 스크롤 위치를 기억
    else stack.push({el:a, off:a.getBoundingClientRect().top, label:whereEl(a)}); // 본문에서 눌렀으면 그 링크가 같은 높이에 오게
    openTo(t);
    t.scrollIntoView({behavior:'smooth',block:'start'}); flash(t);
    render();
  });
  function back(){
    var s=stack.pop(); if(!s)return;
    if(s.el){openTo(s.el); window.scrollTo({top:s.el.getBoundingClientRect().top+window.scrollY-s.off,behavior:'smooth'}); flash(s.el);}
    else window.scrollTo({top:s.y,behavior:'smooth'});
    render();
  }
  btn.addEventListener('click',back);
  document.addEventListener('keydown',function(e){
    if(e.key!=='Backspace'||!stack.length)return;
    var tg=e.target.tagName; if(tg==='INPUT'||tg==='TEXTAREA'||e.target.isContentEditable)return;
    e.preventDefault(); back();
  });
  // 주소에 #id가 붙어 열리거나 바뀌면(다른 파일에서 온 링크 등) 접힌 details 안이라도 펼쳐서 보여 준다
  function fromHash(){
    if(location.hash.length<2)return;
    var t=document.getElementById(decodeURIComponent(location.hash.slice(1))); if(!t)return;
    openTo(t); t.scrollIntoView({block:'start'}); flash(t);
  }
  window.addEventListener('hashchange',fromHash);
  fromHash();
})();
</script>
<!--jump:end-->
